<script>
/**
 * JuriTask — gmail.js
 * Fase 1 — Detección de trámites nuevos desde el correo (Google Workspace).
 *
 * Flujo (100% en el navegador, sin backend):
 *   1. El usuario pulsa "Revisar correo".
 *   2. Se obtiene un token de Google con permiso `gmail.readonly`.
 *   3. Se buscan los correos de notificación de trámite (remitente + asunto).
 *   4. Se parsea cada correo y se extraen los campos del "nuevo trámite".
 *   5. Se descartan los que ya existen (por número) y se muestra un panel
 *      de revisión; al confirmar se abre el modal de "nuevo trámite" prellenado.
 *
 * NOTA: no usa IA. Los correos de notificación tienen un formato fijo, así que
 * la extracción es por etiquetas ("Fecha Vencimiento:", "Trámite:", …).
 */

// ── Configuración de la búsqueda ─────────────────────────────
const GMAIL_QUERY = 'from:comjuridico@comfenalcovalle.com.co subject:("Notificación de trámite" OR "Notificacion de tramite") newer_than:120d';

// Alias de prefijo de radicado → sigla de módulo de la app.
// El radicado (p. ej. OTRD-2026-864) trae un prefijo que no siempre coincide
// con la sigla configurada. Aquí se mapean los casos conocidos.
const MODULO_PREFIX_ALIAS = {
  OTRD: 'OTR',
};

// ── Acceso a Gmail ────────────────────────────────────────────
// El transporte lo hace el servidor (`gmailApi` en server/Correo.gs): así el
// token no viaja al navegador. Lo que devuelve es el mismo JSON que devolvía
// `fetch`, de modo que todo el parseo de abajo sigue igual.
async function _gmailFetch(path) {
  return JSON.parse(await srv('gmailApi', path));
}

async function _listTramiteMessages() {
  const data = await _gmailFetch('messages?maxResults=25&q=' + encodeURIComponent(GMAIL_QUERY));
  return data.messages || [];
}

async function _getMessage(id) {
  return _gmailFetch('messages/' + id + '?format=full');
}

// ── Decodificación de cuerpo ─────────────────────────────────
function _b64urlToText(data) {
  try {
    const b64 = data.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch (_) {
    return '';
  }
}

function _extractBody(payload) {
  let html = '', text = '';
  (function walk(p) {
    if (!p) return;
    if (p.mimeType === 'text/html' && p.body && p.body.data)      html += _b64urlToText(p.body.data);
    else if (p.mimeType === 'text/plain' && p.body && p.body.data) text += _b64urlToText(p.body.data);
    (p.parts || []).forEach(walk);
  })(payload);
  return html || text;
}

function _stripHtml(s) {
  return String(s || '')
    .replace(/<\s*br\s*\/?>/gi, ' ')
    .replace(/<\/(p|div|tr|td|span|strong|b|font)>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&aacute;/gi, 'á').replace(/&eacute;/gi, 'é').replace(/&iacute;/gi, 'í')
    .replace(/&oacute;/gi, 'ó').replace(/&uacute;/gi, 'ú').replace(/&ntilde;/gi, 'ñ')
    .replace(/\s+/g, ' ')
    .trim();
}

function _headerValue(payload, name) {
  const h = (payload.headers || []).find(x => x.name.toLowerCase() === name.toLowerCase());
  return h ? h.value : '';
}

// ── Fecha DD/MM/YYYY → YYYY-MM-DD ─────────────────────────────
function _fechaISOFromDMY(dmy) {
  const m = /([0-3]?\d)\/([01]?\d)\/(\d{4})/.exec(dmy || '');
  if (!m) return '';
  const [, d, mo, y] = m;
  return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
}

// ── Descripción corta a partir del resumen ───────────────────
// Toma la primera parte significativa del resumen (hasta la primera coma o
// conector como "tiene como objeto", "por el", "con el fin"…), o recorta a ~90
// caracteres en un borde de palabra. Así la descripción queda breve y suele
// contener el contratista / peticionario / objeto del trámite.
function _shortDesc(resumen) {
  let s = String(resumen || '').trim().replace(/\s+/g, ' ');
  if (!s) return '';
  const marcadores = [
    s.indexOf(','),
    s.search(/\btiene como objeto\b/i),
    s.search(/\bcon el fin\b/i),
    s.search(/\bpor el inmueble\b/i),
    s.search(/\bpara dar\b/i),
    s.search(/\bquien tiene\b/i),
  ].filter(i => i > 15);
  let cut = marcadores.length ? Math.min(...marcadores) : -1;
  if (cut === -1 || cut > 90) {
    if (s.length > 90) {
      cut = s.lastIndexOf(' ', 90);
      if (cut < 40) cut = 90;
    } else {
      cut = s.length;
    }
  }
  s = s.slice(0, cut).trim().replace(/[;:,.\-\s]+$/, '');
  return sentenceCase(s);
}

// ── Normalización de nombres para emparejar abogados ─────────
function _normName(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toUpperCase().replace(/[^A-Z\s]/g, '').replace(/\s+/g, ' ').trim();
}

// Empareja el "Responsable" del correo con un abogado configurado.
// Devuelve { key, nombre } si lo encuentra; si no, { key:null, nombre } (sugerencia).
function _matchAbogado(responsable) {
  const target = _normName(responsable);
  if (!target) return { key: null, nombre: '' };

  const candidates = [];
  (STATE.config.abogados || []).forEach(a => candidates.push({ key: a.key, nombre: a.nombre }));

  // Coincidencia exacta normalizada, o por inclusión (nombre config ⊆ responsable
  // o viceversa) para tolerar segundos nombres/apellidos abreviados.
  for (const c of candidates) {
    const cn = _normName(c.nombre);
    if (cn && (cn === target || target.includes(cn) || cn.includes(target))) {
      return { key: c.key, nombre: c.nombre };
    }
  }
  return { key: null, nombre: titleCase(responsable.toLowerCase()) };
}

// Mapea el prefijo del radicado a una sigla de módulo existente.
function _matchModulo(radicado) {
  const prefix = String(radicado || '').split('-')[0].toUpperCase();
  if (!prefix) return '';
  const sigla = MODULO_PREFIX_ALIAS[prefix] || prefix;
  const exists = (STATE.config.modulos || []).some(m => m.sigla === sigla);
  return exists ? sigla : '';
}

// ── Parseo de un correo → objeto de detección ────────────────
function parseTramiteEmail(message) {
  const payload = message.payload || {};
  const rawBody = _extractBody(payload);
  const body    = _stripHtml(rawBody);
  const subject = _stripHtml(_headerValue(payload, 'Subject'));

  const pick = (re, src = body) => { const m = re.exec(src); return m ? m[1].trim() : ''; };

  let radicado = pick(/radicado\s+([A-Za-z]+-\d{4}-\d+)/i);
  if (!radicado) radicado = pick(/([A-Za-z]{2,5}-\d{4}-\d+)/, subject); // fallback: asunto

  const tramiteNum  = pick(/Tr[aá]mite:\s*(\d{4,8})/i);
  const vencDMY     = pick(/vencimiento[:\s]*([0-3]?\d\/[01]?\d\/\d{4})/i);
  const tipo        = pick(/TIPO\s+SOLICITUD:\s*([^/]+?)\s*\/\s*SOLICITANTE:/i);
  const solicitante = pick(/SOLICITANTE:\s*([^/]+?)\s*\/\s*AREA:/i);
  const area        = pick(/AREA:\s*([^/]+?)\s*\/\s*RESUMEN:/i);
  let   resumen     = pick(/RESUMEN:\s*(.+?)\s*Detalles:/i);
  if (!resumen) resumen = pick(/RESUMEN:\s*(.+?)(?:Tr[aá]mite:|$)/i);
  let   responsable = pick(/Responsable:\s*(.+?)\s*Auxiliar:/i);
  if (!responsable) responsable = pick(/Responsable:\s*([A-Za-zÁÉÍÓÚÑáéíóúñ.\s]{3,60})/i);

  // Número del trámite = campo "Trámite:" (no el radicado). Fallback: radicado.
  const numero = tramiteNum || radicado;
  if (!numero) return null; // sin identificador no sirve

  const modulo   = _matchModulo(radicado);
  const abogado  = _matchAbogado(responsable);

  // Descripción CORTA: la parte esencial del resumen (contratista / peticionario
  // / objeto), no el resumen completo. El detalle íntegro va en la nota inicial.
  const descripcion = _shortDesc(resumen) || sentenceCase(tipo || '') || 'Trámite';

  // Nota inicial con el detalle completo del correo (nada se pierde).
  const notaPartes = [];
  if (radicado)    notaPartes.push(`Radicado: ${radicado}`);
  if (tipo)        notaPartes.push(`Tipo: ${sentenceCase(tipo)}`);
  if (solicitante) notaPartes.push(`Solicitante: ${titleCase(solicitante.toLowerCase())}`);
  if (area)        notaPartes.push(`Área: ${titleCase(area.toLowerCase())}`);
  if (responsable) notaPartes.push(`Responsable: ${titleCase(responsable.toLowerCase())}`);
  if (resumen)     notaPartes.push(`Resumen: ${sentenceCase(resumen)}`);
  const nota = notaPartes.join(' · ');

  return {
    numero,
    radicado,
    modulo,
    descripcion,
    fechaVencimiento: _fechaISOFromDMY(vencDMY),
    responsableNombre: abogado.nombre,
    abogadoKey: abogado.key,
    tipo: sentenceCase(tipo || ''),
    solicitante: titleCase((solicitante || '').toLowerCase()),
    area: titleCase((area || '').toLowerCase()),
    nota,
    _messageId: message.id,
  };
}

// ── Escaneo completo ─────────────────────────────────────────
async function scanTramiteEmails() {
  return _conGmail(async () => {
    const list = await _listTramiteMessages();
    const detections = [];
    for (const ref of list) {
      try {
        const d = parseTramiteEmail(await _getMessage(ref.id));
        if (d) detections.push(d);
      } catch (e) {
        // Un correo con formato raro no debe tumbar el escaneo entero.
        console.warn('Error parseando correo', ref.id, e.message);
      }
    }
    return detections;
  });
}

// Quita las detecciones cuyo número ya existe como trámite o fue descartado.
function _filterNuevos(detections) {
  const existentes  = new Set((STATE.tramites || []).map(t => String(t.numero)));
  const descartados = new Set((STATE.config.gmailDescartados || []).map(String));
  const vistos = new Set();
  return detections.filter(d => {
    const n = String(d.numero);
    if (existentes.has(n) || descartados.has(n) || vistos.has(n)) return false;
    vistos.add(n);
    return true;
  });
}

// Marca un trámite detectado como descartado (persiste en la config para que no
// vuelva a aparecer en próximas revisiones del correo).
function _descartarDeteccion(numero) {
  const n = String(numero);
  STATE.config.gmailDescartados = STATE.config.gmailDescartados || [];
  if (!STATE.config.gmailDescartados.includes(n)) {
    STATE.config.gmailDescartados.push(n);
    if (typeof saveAll === 'function') saveAll();
  }
}

// ── Prellenar el modal de "nuevo trámite" ────────────────────
function prefillNewTramite(d) {
  if (typeof openModal !== 'function') return;
  openModal();                       // abre el modal en modo "nuevo"
  const set = (id, val) => { const el = document.getElementById(id); if (el != null && val != null) el.value = val; };
  set('fNumero', d.numero);
  set('fDescripcion', d.descripcion);
  if (d.modulo) set('fModulo', d.modulo);
  if (d.fechaVencimiento) set('fFechaVencimiento', d.fechaVencimiento);

  // Nota inicial con el detalle del correo.
  if (d.nota) {
    set('fNota', sentenceCase(d.nota));
    const wrap = document.getElementById('nuevaNotaFieldsModal');
    if (wrap) wrap.style.display = 'block';
  }

  // Abogado: si se emparejó con un colaborador manual, preseleccionarlo.
  if (d.abogadoKey && typeof populateModalAssign === 'function') {
    populateModalAssign([d.abogadoKey]);
  } else if (d.responsableNombre) {
    showToast(`Responsable "${d.responsableNombre}" no está en tu lista — asígnalo o agrégalo.`);
  }
}

// ── Detecciones de la sesión ─────────────────────────────────
// La revisión del correo es lenta (una llamada por mensaje), así que el
// resultado se conserva en memoria durante la sesión. Al crear un trámite desde
// el panel, el resto de detecciones siguen ahí: volver a abrir el panel NO
// vuelve a buscar, muestra las que quedan. La búsqueda solo se repite si el
// usuario lo pide ("Buscar de nuevo") o si aún no hay nada en memoria.
let _gmailDetections = [];   // todo lo detectado en la última revisión
let _gmailScanAt     = 0;    // timestamp de esa revisión
let _gmailReopen     = false; // volver al panel cuando se cierre el modal

// Detecciones que todavía no son trámites ni fueron descartadas.
function _gmailPendientes() {
  return _filterNuevos(_gmailDetections);
}

function _gmailUpdateBadge() {
  const badge = document.getElementById('scanMailBadge');
  if (!badge) return;
  const n = _gmailPendientes().length;
  badge.textContent = n;
  badge.style.display = n ? 'flex' : 'none';
  const btn = document.getElementById('scanMailBtn');
  if (btn) {
    btn.title = n
      ? `${n} trámite(s) detectado(s) por revisar`
      : 'Revisar correo (detectar trámites nuevos)';
  }
}

function _gmailHaceTexto(ts) {
  if (!ts) return '';
  const min = Math.round((Date.now() - ts) / 60000);
  if (min < 1)  return 'hace un momento';
  if (min === 1) return 'hace 1 minuto';
  if (min < 60) return `hace ${min} minutos`;
  const h = Math.round(min / 60);
  return h === 1 ? 'hace 1 hora' : `hace ${h} horas`;
}

// ── Panel de revisión ────────────────────────────────────────
let _gmailModalEl = null;

function _buildGmailModal() {
  if (_gmailModalEl) return _gmailModalEl;
  const el = document.createElement('div');
  el.id = 'gmailScanOverlay';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1200;padding:16px';
  el.innerHTML = `
    <div style="background:var(--card,#fff);color:var(--text,#111);max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border,#e5e7eb)">
        <h2 style="margin:0;font-size:17px">Trámites detectados en el correo</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="gmailScanAgain" class="btn-small" style="white-space:nowrap;font-size:12px">Buscar de nuevo</button>
          <button id="gmailScanClose" class="btn-icon" aria-label="Cerrar" style="font-size:20px;line-height:1">✕</button>
        </div>
      </div>
      <div id="gmailScanBody" style="padding:14px 18px;overflow:auto"></div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) _closeGmailModal(); });
  el.querySelector('#gmailScanClose').addEventListener('click', _closeGmailModal);
  el.querySelector('#gmailScanAgain').addEventListener('click', () => {
    _closeGmailModal();
    runGmailScan(document.getElementById('scanMailBtn'), { force: true });
  });
  _gmailModalEl = el;
  return el;
}

function _closeGmailModal() {
  if (_gmailModalEl) _gmailModalEl.style.display = 'none';
  _gmailReopen = false;
}

// Se llama desde closeModal() (ui.js): al terminar de crear —o al cancelar— un
// trámite prellenado, el panel vuelve con las detecciones que quedan.
function _gmailOnModalClosed() {
  if (!_gmailReopen) return;
  _gmailReopen = false;
  _gmailUpdateBadge();
  // Sin esperar, el overlay del panel reaparecería sobre el modal saliente.
  setTimeout(() => {
    const pend = _gmailPendientes();
    if (pend.length) _openGmailModal(pend);
    else _gmailUpdateBadge();
  }, 260);
}

function _openGmailModal(detections) {
  const el   = _buildGmailModal();
  const body = el.querySelector('#gmailScanBody');
  _gmailUpdateBadge();

  const pie = _gmailScanAt
    ? `<p style="font-size:11.5px;color:var(--muted,#9ca3af);margin:12px 0 0">Última revisión del correo ${_gmailHaceTexto(_gmailScanAt)}. Se conservan las detecciones mientras la app siga abierta.</p>`
    : '';

  if (!detections.length) {
    const msg = _gmailDetections.length
      ? 'No quedan trámites por revisar. 🎉'
      : 'No se encontraron trámites nuevos en el correo. 🎉';
    body.innerHTML = `<p style="margin:8px 0 4px;color:var(--muted,#6b7280)">${msg}</p>
      <p style="font-size:12px;color:var(--muted,#9ca3af)">Se revisan los correos de "Notificación de trámite" de los últimos 120 días que aún no estén registrados.</p>${pie}`;
    el.style.display = 'flex';
    return;
  }

  body.innerHTML = `<p style="margin:0 0 12px;color:var(--muted,#6b7280);font-size:13px">
      Quedan <b>${detections.length}</b> trámite(s) por crear. Al crear uno, este panel vuelve con los demás.</p>
    <div id="gmailScanList" style="display:flex;flex-direction:column;gap:10px"></div>${pie}`;

  const list = body.querySelector('#gmailScanList');

  // Cuando ya no quedan tarjetas (todas creadas o descartadas), mostrar vacío.
  const _checkEmpty = () => {
    if (!list.querySelector('[data-card]')) _openGmailModal([]);
  };

  detections.forEach((d) => {
    const card = document.createElement('div');
    card.dataset.card = '1';
    card.style.cssText = 'border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:12px 14px';
    const moduloTxt = d.modulo || '<span style="color:#b45309">(elige módulo)</span>';
    const abogadoTxt = d.abogadoKey
      ? escapeHtml(d.responsableNombre)
      : `${escapeHtml(d.responsableNombre || '—')} <span style="color:#b45309">(no está en tu lista)</span>`;
    const vencTxt = d.fechaVencimiento ? formatDate(d.fechaVencimiento) : '—';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <div style="font-weight:700;font-size:14px">#${escapeHtml(d.numero)}
            <span style="font-weight:500;color:var(--muted,#6b7280)">· ${moduloTxt}</span></div>
          <div style="font-size:13px;margin-top:3px">${escapeHtml(d.descripcion)}</div>
          <div style="font-size:12px;color:var(--muted,#6b7280);margin-top:5px">
            Vence: <b>${vencTxt}</b> · Responsable: ${abogadoTxt}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:stretch">
          <button data-act="crear" class="btn btn-primary" style="white-space:nowrap;font-size:13px;padding:7px 12px">Revisar y crear</button>
          <button data-act="descartar" class="btn-small" style="white-space:nowrap;font-size:12px;background:transparent;color:var(--text-secondary,#6b7280);border:1px solid var(--border,#e5e7eb)">Descartar</button>
        </div>
      </div>`;
    card.querySelector('[data-act="crear"]').addEventListener('click', () => {
      // Ocultar el panel sin perder el estado: vuelve solo al cerrar el modal.
      if (_gmailModalEl) _gmailModalEl.style.display = 'none';
      _gmailReopen = true;
      prefillNewTramite(d);
    });
    card.querySelector('[data-act="descartar"]').addEventListener('click', () => {
      _descartarDeteccion(d.numero);
      card.remove();
      _gmailUpdateBadge();
      _checkEmpty();
      showToast(`Trámite #${d.numero} descartado. No volverá a aparecer.`);
    });
    list.appendChild(card);
  });

  el.style.display = 'flex';
}

// ── Punto de entrada (botón) ─────────────────────────────────
// `force: true` ignora lo detectado en la sesión y vuelve a leer el correo.
async function runGmailScan(btn, { force = false } = {}) {
  if (btn && btn.dataset.busy) return;

  // Reabrir con lo ya detectado: sin esperas ni llamadas a la API.
  if (!force) {
    const pend = _gmailPendientes();
    if (pend.length) { _openGmailModal(pend); return; }
  }

  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.dataset.busy = '1'; btn.innerHTML = '…'; }
  showToast('Revisando el correo…');
  try {
    const detections = await scanTramiteEmails();
    if (detections === null) return;                 // error o cancelado (ya avisado)
    _gmailDetections = detections;
    _gmailScanAt     = Date.now();
    _openGmailModal(_filterNuevos(detections));
  } finally {
    if (btn) { btn.disabled = false; delete btn.dataset.busy; btn.innerHTML = orig; }
    _gmailUpdateBadge();
  }
}

// ============================================================
// FASE 2 y 3 — BITÁCORA DEL TRÁMITE + CONTACTOS EXTERNOS
// ============================================================

// Dominios/nombres internos que NO cuentan como "contacto externo".
const CONTACTOS_EXCLUIR_DOMINIOS = ['comfenalcovalle.com.co'];
const CONTACTOS_EXCLUIR_NOMBRES  = ['garces lloreda', 'garcés lloreda'];

/**
 * Ejecuta `fn` contra Gmail, con el servidor de por medio.
 *
 * Sustituye al antiguo `_withGmailToken`: ya no hay token que renovar ni popup
 * que reabrir —el servidor está autorizado de forma permanente—, así que solo
 * queda comprobar que hay servidor y traducir el fallo a algo legible.
 */
async function _conGmail(fn) {
  if (typeof BACKEND === 'undefined' || !BACKEND.disponible) {
    showToast('El correo requiere el servidor (Apps Script).');
    return null;
  }
  try {
    return await fn();
  } catch (e) {
    const msg = String(e && e.message || e);
    showToast(msg === 'gmail-401'
      ? 'Gmail rechazó el permiso. Vuelve a autorizar el script.'
      : 'Error de Gmail: ' + msg);
    return null;
  }
}

// Obtiene el radicado (COT-2026-298) de un trámite: del número, la descripción
// o las notas. Devuelve '' si no hay.
function _extractRadicado(t) {
  const re = /\b([A-Za-z]{2,5}-\d{4}-\d+)\b/;
  let m = re.exec(String(t.numero || ''));
  if (m) return m[1];
  m = re.exec(String(t.descripcion || ''));
  if (m) return m[1];
  for (const n of (t.notas || [])) {
    m = re.exec(String(n.texto || ''));
    if (m) return m[1];
  }
  return '';
}

// Busca en Gmail todos los correos relacionados con el trámite (por número y/o
// radicado en el asunto o cuerpo) y devuelve una lista resumida.
async function fetchEmailsForTramite(t) {
  const radicado = _extractRadicado(t);
  const terms = [];
  if (t.numero)  terms.push(`"${String(t.numero).replace(/"/g, '')}"`);
  if (radicado && radicado !== t.numero) terms.push(`"${radicado}"`);
  if (!terms.length) return [];

  const query = `(${terms.join(' OR ')}) newer_than:1y`;

  return _conGmail(async () => {
    // Traer como máximo 15 correos y recortar cada cuerpo: así cada llamada a
    // Gemini consume menos tokens (menos presión sobre la cuota gratuita).
    const data = await _gmailFetch('messages?maxResults=15&q=' + encodeURIComponent(query));
    const refs = data.messages || [];
    const emails = [];
    for (const ref of refs) {
      const msg = await _getMessage(ref.id);
      const payload = msg.payload || {};
      const body = _stripHtml(_extractBody(payload));
      emails.push({
        fecha:   _headerValue(payload, 'Date'),
        de:      _stripHtml(_headerValue(payload, 'From')),
        para:    _stripHtml(_headerValue(payload, 'To')),
        asunto:  _stripHtml(_headerValue(payload, 'Subject')),
        cuerpo:  body.slice(0, 1200),
      });
    }
    // Orden cronológico ascendente.
    emails.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
    return emails;
  });
}

// ── Enganche del botón ───────────────────────────────────────
function initGmailScan() {
  const btn = document.getElementById('scanMailBtn');
  if (btn && !btn.dataset.wired) {
    btn.dataset.wired = '1';
    btn.addEventListener('click', () => runGmailScan(btn));
  }
  _gmailUpdateBadge();
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGmailScan);
  } else {
    initGmailScan();
  }
}

// ============================================================
// ABRIR EL TRÁMITE EN GMAIL
// ============================================================
// Un sitio web no puede tomar el control de una pestaña que abrió el usuario:
// los navegadores no lo permiten. Lo que sí se puede es **nombrar** la ventana
// al abrirla; a partir de ahí, cada `window.open` con ese mismo nombre navega
// esa pestaña en vez de crear otra. En la práctica: el primer clic abre Gmail,
// y los siguientes re-buscan ahí mismo.

const GMAIL_VENTANA = 'juritaskGmail';

function gmailBuscarBtn(t) {
  const q = escapeAttr(_gmailQueryTramite(t));
  return `<button type="button" class="gmail-open-btn" data-gmailq="${q}" ` +
         `title="Buscar este trámite en Gmail" aria-label="Buscar el trámite ${escapeAttr(t.numero)} en Gmail">` +
         `<i data-lucide="mail-search"></i></button>`;
}

function _gmailQueryTramite(t) {
  const num = String(t.numero || '').trim();
  const rad = typeof _extractRadicado === 'function' ? _extractRadicado(t) : '';
  if (num && rad) return `${num} OR "${rad}"`;
  return num || rad;
}

function abrirEnGmail(query) {
  if (!query) return;
  // El índice de cuenta importa cuando hay varias sesiones de Google abiertas:
  // /u/0 es la primera, no necesariamente la del trabajo.
  const idx = STATE.config.gmailCuentaIndice ?? 0;
  const url = `https://mail.google.com/mail/u/${idx}/#search/${encodeURIComponent(query)}`;
  const w = window.open(url, GMAIL_VENTANA);
  if (!w) showToast('El navegador bloqueó la ventana de Gmail.');
}

(function _installGmailOpenHandler() {
  if (window._gmailOpenHandlerInstalled) return;
  window._gmailOpenHandlerInstalled = true;
  // Captura + stopPropagation, igual que el botón de copiar número: si no, el
  // clic abriría además el detalle del trámite.
  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('.gmail-open-btn');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    abrirEnGmail(btn.dataset.gmailq || '');
  }, true);
})();

</script>
